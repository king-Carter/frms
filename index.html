<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Alert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.5s;
        }
    </style>
</head>
<body class="bg-white flex items-center justify-center h-screen">
    <!-- Popup Overlay -->
    <div class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 px-4">
        <!-- Alert Card - Added mx-auto and max-w-full for mobile margins -->
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-auto overflow-hidden border border-gray-200">
            <!-- Header -->
            <div class="bg-red-600 px-4 py-3 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <h3 class="ml-2 text-white font-semibold text-lg">Critical Security Alert</h3>
            </div>
            
            <!-- Body -->
            <div class="p-6">
                <div class="text-gray-800 mb-4">
                    Your website will be permanently deleted in <span class="font-bold text-red-600">59 minutes</span> due to suspicious activity.
                </div>
                
                <div class="text-gray-700 text-sm mb-6">
                    Enter your administrator password to cancel the deletion process immediately.
                </div>
                
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-medium mb-2" for="password">
                        Administrator Password
                    </label>
                    <input 
                        id="password" 
                        type="password" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" 
                        placeholder="Enter your password"
                        autofocus
                    >
                </div>
                
                <div class="flex justify-end space-x-3">
                    <button id="cancel-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500">
                        Cancel
                    </button>
                    <button id="submit-btn" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500">
                        Verify & Cancel Deletion
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submit-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const popup = document.querySelector('.bg-white');

            // Handle password submission
            submitBtn.addEventListener('click', function() {
                if (passwordInput.value.trim() === '') {
                    popup.classList.add('shake');
                    setTimeout(() => popup.classList.remove('shake'), 500);
                    passwordInput.focus();
                    return;
                }
                
                // Always show incorrect password
                popup.classList.add('shake');
                setTimeout(() => popup.classList.remove('shake'), 500);
                passwordInput.value = '';
                passwordInput.focus();
                
                // Show error message
                const errorMsg = document.createElement('div');
                errorMsg.className = 'text-red-600 text-sm mt-2';
                errorMsg.textContent = 'Incorrect password. Try again.';
                
                // Remove any existing error messages
                const existingError = document.querySelector('.text-red-600.text-sm.mt-2');
                if (existingError) {
                    existingError.remove();
                }
                
                passwordInput.parentNode.appendChild(errorMsg);
            });

            // Make cancel button less obvious
            cancelBtn.addEventListener('click', function() {
                // Make it seem like cancel doesn't work immediately
                popup.classList.add('shake');
                setTimeout(() => popup.classList.remove('shake'), 500);
                
                // After 3 attempts, allow closing
                let attempts = parseInt(cancelBtn.dataset.attempts || '0') + 1;
                cancelBtn.dataset.attempts = attempts;
                
                if (attempts >= 3) {
                    document.querySelector('.bg-black').style.display = 'none';
                }
            });

            // Prevent closing by clicking outside
            document.querySelector('.bg-black').addEventListener('click', function(e) {
                if (e.target === this) {
                    popup.classList.add('shake');
                    setTimeout(() => popup.classList.remove('shake'), 500);
                }
            });
        });
    </script>
</body>
</html>
